name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Test coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: reserva-salas-dist
          path: dist/
          if-no-files-found: error